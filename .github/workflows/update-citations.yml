name: Update Scholar Data

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-citations.yml"
      - "scripts/update-scholar-citations.mjs"
      - "lib/citation-model.mjs"
      - "tests/citations.test.mjs"

permissions:
  contents: write

concurrency:
  group: scholar-citation-sync
  cancel-in-progress: false

jobs:
  update-scholar-data:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test citation validation and failure protection
        run: node --test tests/citations.test.mjs
      - name: Fetch and validate complete Scholar snapshot
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: node scripts/update-scholar-citations.mjs
      - name: Commit successful snapshot
        run: |
          if git diff --quiet -- data/scholar-stats.json; then
            echo "No citation snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar-stats.json
          git commit -m "chore: update verified Scholar snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report sync failure
        if: failure()
        run: echo "Citation sync failed. Last successful data was retained; check the failed step above." >> "$GITHUB_STEP_SUMMARY"
